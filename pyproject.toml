[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprd"
version = "0.1.0"
description = "Generate code-level functional tests from Product Requirement Documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.10",
    "jsonschema>=4.20",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["prd_parser"]
